# The crates.io publish job — the only workflow trusted with the OIDC
# publishing identity. crates.io Trusted Publishing binds to this
# filename, this repository and the `release` environment, and the
# release-published event is the trigger: the registry upload always
# runs after the GitHub release it belongs to, never on a pushed ref
# alone. No stored secret exists — the job exchanges a GitHub OIDC
# token for a short-lived crates.io token.
name: publish

on:
  release:
    types: [published]

permissions: {}

# One queue slot per release event: a single shared group would let
# GitHub replace a still-pending publish with a newer release and drop
# the earlier upload entirely. Keyed on the immutable release id, a
# re-run of the same event still serializes while distinct releases
# never evict one another.
concurrency:
  group: publish-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  crates:
    runs-on: ubuntu-latest
    # A no-compile package+publish needs minutes, not the 360-minute job
    # default: a black-holed endpoint must fail fast, not hold the
    # release's concurrency slot for six hours.
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      # Pinned so a rust-toolchain file in the checkout — including one
      # naming a `path` toolchain with a poisoned cargo — can never pick
      # the executable that runs under the publishing identity.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The `release` environment's required-reviewers rule is the
      # operator's approval gate — a provisioning precondition set
      # under Settings → Environments → release → Required reviewers.
      # GITHUB_TOKEN cannot read protection rules, so the gate proves
      # itself from this run's record: an enforced deployment leaves an
      # approved review naming the environment; an auto-created or
      # unprotected environment starts the job with none and fails
      # here, before the crates.io authentication. Residual: GitHub
      # re-uses the run id on 'Re-run failed jobs', so the record is
      # run-scoped rather than attempt-scoped — a review approved on
      # an earlier attempt still satisfies this step.
      - name: Require the recorded release approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          approvals=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved")
                   | select(any(.environments[]?; .name == "release"))] | length')
          test "$approvals" -gt 0 || {
            echo "no approved release-environment review is on record" >&2
            exit 1
          }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # An isolated cargo home keeps a candidate .cargo/config.toml — a
      # credential provider is an executable — from loading under the
      # publishing identity.
      - name: Isolate the cargo home
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      # The uploaded version is the one the release names: without this
      # check a stray release.published event would ship whatever
      # version Cargo.toml happens to carry. Enforced before any
      # authentication so a mistagged release never reaches the OIDC
      # exchange — and before the already-published skip, which must
      # only ever short-circuit the release it belongs to.
      - name: Bind the release tag to the package version
        run: |
          vers=$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_WORKSPACE/Cargo.toml" | head -1)
          test "$GITHUB_REF_NAME" = "v$vers" || {
            echo "release tag $GITHUB_REF_NAME does not match package version v$vers" >&2
            exit 1
          }

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Package without verifying: --no-verify keeps the step to file
      # staging so no build script or compiled code runs under the
      # token. Running cargo from outside the checkout on the manifest
      # path keeps the checkout's own .cargo/config.toml unloaded too.
      - name: Package the crate
        run: |
          (cd "$RUNNER_TEMP" && cargo package --no-verify \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml")

      # Upload the staged tarball, not the checkout: the extracted copy
      # gets its .cargo and rust-toolchain files stripped before cargo
      # sees it, and --no-verify publishes without compiling. The sparse
      # index is probed first: a version already on the registry — a
      # first publish made by hand to claim the name, a retried run —
      # is a green skip, not an error.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          stage=$(mktemp -d)
          tar -xzf "$GITHUB_WORKSPACE"/target/package/*.crate -C "$stage"
          package=$(find "$stage" -mindepth 1 -maxdepth 1 -type d)
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' "$package/Cargo.toml" | head -1)
          vers=$(sed -n 's/^version = "\(.*\)"/\1/p' "$package/Cargo.toml" | head -1)
          case ${#name} in
            1) idx="1/$name";;
            2) idx="2/$name";;
            3) idx="3/${name:0:1}/$name";;
            *) idx="${name:0:2}/${name:2:2}/$name";;
          esac
          if curl -fsSL --connect-timeout 10 --max-time 30 \
               "https://index.crates.io/$idx" | grep -q "\"vers\":\"$vers\""; then
            echo "$name $vers is already on crates.io — skipping"
            exit 0
          fi
          rm -f "$package/Cargo.toml.orig" \
            "$package/rust-toolchain" "$package/rust-toolchain.toml"
          rm -rf "$package/.cargo"
          (cd "$package" && cargo publish --no-verify --registry crates-io)

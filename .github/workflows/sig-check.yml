name: clean-your-attribution

# Dual-entry check workflow:
# - pull_request / merge_group / push: can be referenced directly by a repo
#   ruleset "Require workflows to pass" rule — no per-repo caller needed.
# - workflow_call: can be reused by a thin caller file in repositories where
#   ruleset workflow references are unavailable.
# The cya binary is provisioned from the published crates.io package:
# the maximum stable version the sparse index resolves is pinned and
# logged per run ("what scanned this commit" is answerable from the run
# output), built --locked, and cached per version so warm runs skip the
# compile. A failed registry install falls back to the same version's
# tag; an unresolvable index falls back to building HEAD — but only for
# this repository's own pre-publication runs; consumers fail closed.
# The policy travels inside the binary.

on:
  workflow_call:
  pull_request:
  merge_group:
  push:

permissions:
  contents: read

env:
  # The only repository whose pre-publication runs may fall back to a
  # HEAD build — every consumer fails closed on an unresolvable index.
  # A fixed literal on purpose: a consumer-settable variable would let
  # a fork enable the fallback.
  CYA_UPSTREAM: Unka-Malloc/Clean-Your-Attribution

jobs:
  scan:
    name: attribution scan
    # Push events scan only the default branch: work on a feature branch is
    # covered by its pull_request scan, so a push-then-PR flow would pay for
    # the same commits twice. Tags are deliberately NOT scanned here — a tag
    # can carry its own workflow definition, so tag writes are restricted by
    # the installed tag ruleset instead. A skipped job still satisfies a
    # required check.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # A stalled index or registry host must not hold a billed runner for the
    # job default — every step below is seconds-to-minutes of real work.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scan range
        id: range
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
              ;;
            merge_group)
              echo "range=${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              # A zero `before` means a new ref: everything reachable from
              # the pushed head is new, so scan it.
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                echo "range=HEAD" >> "$GITHUB_OUTPUT"
              else
                echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "range=HEAD" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Resolve the published cya version
        id: cya-version
        run: |
          # Every index record is judged: yanked entries are dropped and
          # the maximum semver wins — releases outrank prereleases and
          # prerelease identifiers compare numeric-then-lexical — so a
          # backported patch cannot steal the pin. A failed fetch is
          # absorbed into an empty version (not a dead run); this step
          # then fails closed for consumer repositories, while upstream's
          # own pre-publication runs continue to the HEAD build in the
          # provisioning step.
          if ! index="$(curl -fsSL --connect-timeout 5 --max-time 20 --retry 3 --retry-delay 2 \
            https://index.crates.io/cl/ea/clean-your-attribution)"; then
            echo "index fetch failed — resolving an empty version"
            index=""
          fi
          ver="$(printf '%s' "$index" | python3 -c '
          import json, re, sys
          versions = []
          for line in sys.stdin:
              try:
                  rec = json.loads(line)
              except ValueError:
                  continue
              v = rec.get("vers", "")
              if rec.get("yanked") or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?", v):
                  continue
              versions.append(v)
          pool = [v for v in versions if "-" not in v] or versions
          def key(v):
              main, _, pre = v.partition("-")
              nums = tuple(int(x) for x in main.split("."))
              prekey = tuple((0, int(x)) if x.isdigit() else (1, x)
                             for x in pre.split(".")) if pre else ((2,),)
              return (nums, prekey)
          print(max(pool, key=key) if pool else "")
          ')"
          echo "resolved cya ${ver:-<none — unreleased path>}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # A consumer fails closed here, before any cache restore or
          # compile spends runner time: only this repository's own
          # pre-publication runs may continue to the HEAD build.
          if [ -z "$ver" ] && [ "$GITHUB_REPOSITORY" != "$CYA_UPSTREAM" ]; then
            echo "cya version unresolvable — the crates.io index is unreachable or names no usable release; failing closed" >&2
            exit 1
          fi

      # Keyed on the resolved release: an unresolvable index must not
      # restore a binary cached under a different name.
      - name: Cache the cya binary
        if: steps.cya-version.outputs.version != ''
        id: cya-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cya
          key: cya-bin-${{ steps.cya-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      # The registry restore is tens of MB — skip it when the binary itself
      # is already cached: nothing below consumes the registry on a warm run.
      - name: Cache cargo registry
        if: steps.cya-bin.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cya-cargo-${{ runner.os }}-${{ runner.arch }}
          restore-keys: cya-cargo-

      - name: Provision cya
        env:
          CYA_VERSION: ${{ steps.cya-version.outputs.version }}
        run: |
          set -e
          if [ -x ~/.cargo/bin/cya ]; then
            echo "cached cya $CYA_VERSION"
          elif [ -z "$CYA_VERSION" ]; then
            # Unreleased path: the index could not name a version. The
            # resolve step already fails closed for consumers — only
            # upstream's own pre-publication runs reach this branch.
            echo "no published version resolved — building unreleased HEAD from source"
            cargo install --git https://github.com/Unka-Malloc/Clean-Your-Attribution \
              --locked --bin cya
          elif ! cargo install "clean-your-attribution@${CYA_VERSION}" \
                --locked --bin cya; then
            # Pre-release fallback: the same version's tag, never a
            # floating HEAD — a run of an unreleased tree says so.
            echo "registry install failed — building tag v${CYA_VERSION} from source"
            cargo install --git https://github.com/Unka-Malloc/Clean-Your-Attribution \
              --tag "v${CYA_VERSION}" \
              --locked --bin cya
          fi
          ~/.cargo/bin/cya policy --check

      - name: Scan commit range
        run: ~/.cargo/bin/cya scan --range "${{ steps.range.outputs.range }}"

      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | ~/.cargo/bin/cya scan --stdin

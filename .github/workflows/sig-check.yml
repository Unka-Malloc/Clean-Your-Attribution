name: clean-your-attribution

# Dual-entry check workflow:
# - pull_request / merge_group / push: can be referenced directly by a repo
#   ruleset "Require workflows to pass" rule — no per-repo caller needed.
# - workflow_call: can be reused by a thin caller file in repositories where
#   ruleset workflow references are unavailable.
# The cya binary is provisioned from the published crates.io package,
# pinned to the version the sparse index resolves for this run (logged —
# "what scanned this commit" is answerable from the run output) and built
# --locked, with a tag-pinned `cargo install --git` as the pre-release
# fallback. The resolved binary is cached per version, so warm runs skip
# the compile entirely. The policy travels inside the binary.

on:
  workflow_call:
  pull_request:
  merge_group:
  push:

permissions:
  contents: read

jobs:
  scan:
    name: attribution scan
    # Push events scan only the default branch: work on a feature branch is
    # covered by its pull_request scan, so a push-then-PR flow would pay for
    # the same commits twice. Tags are deliberately NOT scanned here — a tag
    # can carry its own workflow definition, so tag writes are restricted by
    # the installed tag ruleset instead. A skipped job still satisfies a
    # required check.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scan range
        id: range
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
              ;;
            merge_group)
              echo "range=${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              # A zero `before` means a new ref: everything reachable from
              # the pushed head is new, so scan it.
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                echo "range=HEAD" >> "$GITHUB_OUTPUT"
              else
                echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "range=HEAD" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cya-cargo-${{ runner.os }}-${{ runner.arch }}
          restore-keys: cya-cargo-

      - name: Resolve the published cya version
        id: cya-version
        run: |
          set -e
          # The same sparse index cargo reads: last record is the latest
          # published version — the run's pin and cache key.
          ver="$(curl -fsSL https://index.crates.io/cl/ea/clean-your-attribution \
            | tail -n1 | python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["vers"])')"
          echo "resolved cya $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Cache the cya binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cya
          key: cya-bin-${{ steps.cya-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Provision cya
        run: |
          set -e
          if [ -x ~/.cargo/bin/cya ]; then
            echo "cached cya ${{ steps.cya-version.outputs.version }}"
          elif ! cargo install "clean-your-attribution@${{ steps.cya-version.outputs.version }}" \
                --locked --bin cya; then
            # Pre-release fallback: the same version's tag, never a
            # floating HEAD — a run of an unreleased tree says so.
            echo "registry install failed — building tag v${{ steps.cya-version.outputs.version }} from source"
            cargo install --git https://github.com/Unka-Malloc/Clean-Your-Attribution \
              --tag "v${{ steps.cya-version.outputs.version }}" \
              --locked --bin cya
          fi
          ~/.cargo/bin/cya policy --check

      - name: Scan commit range
        run: ~/.cargo/bin/cya scan --range "${{ steps.range.outputs.range }}"

      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | ~/.cargo/bin/cya scan --stdin

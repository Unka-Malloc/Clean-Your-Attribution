[package]
name = "attribution-gate"
version = "0.1.0"
edition = "2021"
description = "One attribution policy, three enforcement surfaces: local commit cleaning, server-side push/PR denial, and fleet rollout."

[lib]
name = "attribution_gate"
path = "src/lib.rs"

[[bin]]
name = "cya"
path = "src/main.rs"

[[bin]]
name = "ag-apply"
path = "src/bin/apply.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
